name: Import complete H5 update

on:
  push:
    branches:
      - main
    paths:
      - ".update-parts/**"
      - ".github/workflows/import-update.yml"

permissions:
  contents: write

concurrency:
  group: h5-update-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - name: Check out staged update
        uses: actions/checkout@v4

      - name: Reassemble and verify update package
        run: |
          cat .update-parts/part-* > "$RUNNER_TEMP/xiaoyu-h5-update.zip"
          echo "74c2b42aed19581d2a2d0663fce3a8d4c8f31a412c46298ba536a9a1c2c807b2  $RUNNER_TEMP/xiaoyu-h5-update.zip" | sha256sum --check
          unzip -t "$RUNNER_TEMP/xiaoyu-h5-update.zip"

      - name: Replace repository with extracted files
        run: |
          update_dir="$RUNNER_TEMP/xiaoyu-h5-update"
          mkdir -p "$update_dir"
          unzip -q "$RUNNER_TEMP/xiaoyu-h5-update.zip" -d "$update_dir"
          file_count="$(find "$update_dir" -type f | wc -l)"
          test "$file_count" -eq 171
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .update-parts -exec rm -rf -- {} +
          cp -a "$update_dir"/. .
          rm -rf -- .update-parts
          test -f index.html
          test -f .github/workflows/sync-and-deploy.yml
          test ! -f xiaoyu-h5-update-20260910.zip

      - name: Commit extracted update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Replace repository with extracted H5 update"
          git push
